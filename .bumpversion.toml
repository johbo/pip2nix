[tool.bumpversion]
current_version = "0.10.0"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "setup.py"
search = "VERSION = '{current_version}'"
replace = "VERSION = '{new_version}'"

[[tool.bumpversion.files]]
filename = "pip2nix/__init__.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[[tool.bumpversion.files]]
filename = "docs/conf.py"
search = "release = '{current_version}'"
replace = "release = '{new_version}'"

# python-packages.nix is generated, and carries the version twice: in
# the header pip2nix writes, and in pip2nix's own entry.
[[tool.bumpversion.files]]
filename = "python-packages.nix"
search = "# Generated by pip2nix {current_version}"
replace = "# Generated by pip2nix {new_version}"

[[tool.bumpversion.files]]
filename = "python-packages.nix"
search = """    pname = "pip2nix";
    version = "{current_version}";"""
replace = """    pname = "pip2nix";
    version = "{new_version}";"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.rst"
search = """Unreleased
=========="""
replace = """{new_version}
=========="""
